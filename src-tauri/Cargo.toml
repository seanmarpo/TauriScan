[workspace]
members = [".", "tauri-plugin-fuzz-harness"]

[package]
name = "taurifuzz"
version = "0.1.0"
edition = "2021"

[lib]
name = "taurifuzz"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-fuzz-harness = { path = "./tauri-plugin-fuzz-harness" }
