[package]
name = "tauri-plugin-fuzz-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2" }
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
